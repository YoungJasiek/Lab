name: Merge Knowledge Base

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Generate map
        run: |
          python .github/scripts/generate_map.py

      - name: Merge knowledge base
        run: |
          python .github/scripts/merge_knowledge.py

      - name: Upload merged artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-bundle
          path: knowledge_base_bundle.txt
