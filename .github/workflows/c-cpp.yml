name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    name: Windows MSVC Build & Test
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build All Targets
      run: cmake --build build --config Release

    - name: Setup Mesa OpenGL Driver for Headless Testing
      shell: pwsh
      run: |
        curl.exe -L -o mesa.7z "https://github.com/mmozeiko/build-mesa/releases/download/26.2.4/mesa-llvmpipe-x64-26.2.4.7z"
        7z e mesa.7z -o"build/Release" opengl32.dll -r -y
        7z e mesa.7z -o"build/Debug" opengl32.dll -r -y

    - name: Run Test Verification Suite
      working-directory: build/Release
      run: ./TestVerify.exe

  build-linux:
    name: Linux (${{ matrix.compiler }} / ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Debug
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: Release
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: Debug

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux X11 and OpenGL dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang cmake pkg-config \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libgl1-mesa-dev

    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

    - name: Build All Targets
      run: cmake --build build --config ${{ matrix.build_type }} -j$(nproc)

    - name: Run Test Verification Suite
      run: ./build/TestVerify

  warnings:
    name: Compiler Warnings Audit (Non-Blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux X11 and OpenGL dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libgl1-mesa-dev

    - name: Configure CMake with Strict Warning Flags
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Wold-style-cast -Wsign-conversion"

    - name: Build All Targets (Audit Warnings)
      run: cmake --build build -j$(nproc)

